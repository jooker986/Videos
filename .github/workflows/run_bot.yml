name: Run Telegram Bot 24/7

on:
  # التشغيل التلقائي كل 6 ساعات
  schedule:
    - cron: '0 */6 * * *'
  # إمكانية التشغيل اليدوي في أي وقت من تبويب Actions
  workflow_dispatch:
  # إعادة التشغيل تلقائياً عند رفع أي تعديل جديد على الكود
  push:
    branches:
      - main

# إلغاء أي نسخة قديمة شغالة عند بدء نسخة جديدة لمنع تعارض البوت
concurrency:
  group: telegram-bot-instance
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # إيقاف المهمة قبل حد الـ 6 ساعات بـ 10 دقائق لتسليم المهمة للدورة التالية بسلاسة
    timeout-minutes: 350

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 4. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
