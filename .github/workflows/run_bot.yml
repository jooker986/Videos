name: Run InstaPay Bot 24/7

on:
  workflow_dispatch:

concurrency:
  group: instapay-bot-singleton
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot (for 5h 40m)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          timeout -s SIGINT 20400 python bot.py || true

      - name: Final Database Save
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add instapay_data.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-save DB" && git pull --no-rebase -X ours origin HEAD && git push origin HEAD)

      - name: Trigger Next Session Immediately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run bot.yml --repo ${{ github.repository }}
