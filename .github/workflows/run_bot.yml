name: Run Telegram Bot 24/7 (2GB Limit)

on:
  schedule:
    # تشغيل تلقائي كل 5 ساعات لضمان استمرارية العمل 24 ساعة بدون انقطاع
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: telegram-bot-instance
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install FFmpeg & Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: 4. Start Local Telegram Bot API & PO Token Servers
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          mkdir -p /tmp/telegram-bot-api-data
          docker run -d --name telegram-bot-api \
            --restart always \
            -p 8081:8081 \
            -v /tmp/telegram-bot-api-data:/var/lib/telegram-bot-api \
            -e TELEGRAM_API_ID=$API_ID \
            -e TELEGRAM_API_HASH=$API_HASH \
            -e TELEGRAM_LOCAL=1 \
            aiogram/telegram-bot-api:latest

          docker run -d --name bgutil-provider \
            --restart always \
            -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:latest

          sleep 5

      - name: 5. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U --pre -r requirements.txt

      - name: 6. Create YouTube Cookies File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf "%s\n" "$YOUTUBE_COOKIES" > cookies.txt
          fi

      - name: 7. Run Bot (Auto-Restart Loop)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          # تشغيل البوت لمدة 5 ساعات و40 دقيقة مع إعادة تشغيل فورية إذا توقف لأي سبب
          END_TIME=$((SECONDS + 20400))
          while [ $SECONDS -lt $END_TIME ]; do
            timeout -s SIGINT $((END_TIME - SECONDS)) python bot.py || true
            if [ $SECONDS -lt $END_TIME ]; then
              echo "Bot exited unexpectedly, restarting in 3 seconds..."
              sleep 3
            fi
          done

      - name: 8. Save User Stats to GitHub
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add users_stats.json
          git diff --staged --quiet || git commit -m "chore: update user stats [skip ci]"
          git push
